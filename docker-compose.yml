# ============================================================
# Shared Airflow configuration
# ============================================================
# A YAML anchor (&name) defines a reusable block; services pull it in with the
# merge key (<<: *name). The three Airflow services previously repeated the same
# build settings, environment and volumes, so a change had to be made in three
# places and could silently drift.

x-airflow-common: &airflow-common

  # Build the local image instead of installing packages at container start.
  # Naming it explicitly means Compose builds once and all three services
  # reuse the same image.
  build:
    context: .
    dockerfile: Dockerfile
  image: barca-airflow:2.8.4

  environment: &airflow-common-env

    # Run Airflow tasks locally without Celery workers.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # PostgreSQL database used by Airflow for its metadata.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow

    # Do not load example DAGs.
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # Use Colombia timezone.
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Bogota

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./.env:/opt/airflow/.env:ro


services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:15
    container_name: barca-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
        - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      # Creates the Airflow metadata database during
      # PostgreSQL's first initialization.
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # Airflow initialization
  # ============================================================

  airflow-init:
    <<: *airflow-common
    container_name: barca-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Inherit the shared settings, then add the admin credentials that only
      # this one-shot service needs.
      <<: *airflow-common-env

      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

    entrypoint: /bin/bash

    command:
      - -c
      - |
        set -e

        echo "Initializing Airflow database..."

        airflow db migrate

        # This service re-runs whenever the image or its configuration changes,
        # so creating the administrator must be idempotent. Without the guard,
        # a duplicate-user error would abort the script under "set -e" and the
        # webserver and scheduler would never start.
        if airflow users list | grep -qw "$${_AIRFLOW_WWW_USER_USERNAME}"; then
          echo "Airflow administrator already exists; skipping creation."
        else
          echo "Creating Airflow administrator..."

          airflow users create \
            --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
            --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
            --firstname Data \
            --lastname Engineer \
            --role Admin \
            --email admin@barca-pipeline.local
        fi

        echo "Airflow initialization completed."


  # ============================================================
  # Airflow Webserver
  # ============================================================

  airflow-webserver:
    <<: *airflow-common
    container_name: barca-airflow-webserver

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    command: webserver


  # ============================================================
  # Airflow Scheduler
  # ============================================================

  airflow-scheduler:
    <<: *airflow-common
    container_name: barca-airflow-scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: scheduler


  # ============================================================
  # Zookeeper
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: barca-zookeeper

    environment:
      # Unique identifier for this Zookeeper server.
      ZOOKEEPER_SERVER_ID: 1

      # Port used by Kafka to communicate with Zookeeper.
      ZOOKEEPER_CLIENT_PORT: 2181

      # Zookeeper timing configuration.
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================
  # Kafka
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: barca-kafka

    depends_on:
      zookeeper:
        condition: service_healthy

    environment:

      # Unique identifier for this Kafka broker.
      KAFKA_BROKER_ID: 1

      # Connect Kafka to Zookeeper.
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Kafka listener configuration.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      # Internal communication between Docker services.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      # Kafka's internal listener.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      # Kafka uses the internal listener for broker communication.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Replication factor must be 1 because we have one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Allow automatic topic creation during development.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Reduce waiting time for a single-broker local environment.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    ports:
      - "9092:9092"


  # ============================================================
  # Kafka UI
  # ============================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: barca-kafka-ui

    depends_on:
      - kafka

    environment:

      # Name displayed in Kafka UI.
      KAFKA_CLUSTERS_0_NAME: barca-kafka

      # Kafka broker address from inside Docker.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    ports:
      - "8081:8080"

  # ============================================================
  # Streaming: Kafka consumer
  # ============================================================

  consumer:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    image: barca-streaming:1.0
    container_name: barca-consumer

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    environment:
      # Service names on the compose network, which is what .env already holds.
      # Running these scripts from the host instead would need localhost:15432
      # and localhost:9092, because those are the published ports.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-warehouse}

    volumes:
      - ./streaming:/app/streaming:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data

    # The consumer is a long-running service: restart it if it dies, but not
    # when it was stopped on purpose.
    restart: unless-stopped

    command: python streaming/consumer.py


  # ============================================================
  # Streaming: Kafka producer (match replay)
  # ============================================================
  # Started on demand rather than with the stack, because a replay is a finite
  # job and not a service:
  #   docker compose run --rm producer --list-matches
  #   docker compose run --rm producer --match-id 3773565 --speed 60

  producer:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    image: barca-streaming:1.0
    container_name: barca-producer

    depends_on:
      kafka:
        condition: service_started

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-warehouse}

    volumes:
      - ./streaming:/app/streaming:ro
      - ./scripts:/app/scripts:ro
      # Writable: StatsBomb event files are cached here on first download.
      - ./data:/app/data

    # Never start with "docker compose up": this profile keeps it out of the
    # default set so it only runs when invoked explicitly.
    profiles: ["manual"]

    entrypoint: ["python", "streaming/producer.py"]


# ============================================================
# Persistent volumes
# ============================================================

volumes:

  # Keeps PostgreSQL data when the container is recreated.
  postgres_data:
